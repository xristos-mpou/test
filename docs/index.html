<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ιδιαίτερα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
/* Layout: one-column phone app, fixed tab bar, full-screen sheets. Look: a tutor's notebook — warm paper, ink-navy panels on graph paper, serif headings */
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --line:#E4E0D6; --ink:#191C27; --muted:#5A5F6E;
  --accent:#2445C8; --accent-soft:#E8EDFC; --on-accent:#FFFFFF;
  --owe:#9A3A0C; --owe-soft:#FCEFE5; --ok:#0E6656; --ok-soft:#E1F1EC;
  --hero:#1D2650;
  --display:'Literata', Georgia, 'Times New Roman', serif;
  --tabbar:#1D2650; --tab-ink:#B9C0DA; --tab-on:#FFFFFF; --tab-on-ink:#1D2650; --on-hero:#FFFFFF; --hero-muted:#C5C8D3; --hero-owe:#FFB98A;
  --danger:#A3222B;
  --shadow:0 1px 2px rgba(25,28,39,.05), 0 6px 18px rgba(25,28,39,.06);
  --glass:rgba(243,242,238,.86);
  --f:'Commissioner', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12141B; --surface:#1B1E28; --line:#2C303D; --ink:#ECEDF2; --muted:#A3A8B8;
  --accent:#8EA8FF; --accent-soft:#232C4A; --on-accent:#0E1430;
  --owe:#FFB28A; --owe-soft:#3A2418; --ok:#7FD6C0; --ok-soft:#173129;
  --hero:#26305E; --on-hero:#FFFFFF; --hero-muted:#B5B9C7; --hero-owe:#FFB98A;
  --danger:#FF8A92; --shadow:0 1px 0 rgba(255,255,255,.03); --glass:rgba(18,20,27,.86);
  --tabbar:#252B44; --tab-ink:#A9B0C8; --tab-on:#8EA8FF; --tab-on-ink:#0E1430; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12141B; --surface:#1B1E28; --line:#2C303D; --ink:#ECEDF2; --muted:#A3A8B8;
  --accent:#8EA8FF; --accent-soft:#232C4A; --on-accent:#0E1430;
  --owe:#FFB28A; --owe-soft:#3A2418; --ok:#7FD6C0; --ok-soft:#173129;
  --hero:#26305E; --on-hero:#FFFFFF; --hero-muted:#B5B9C7; --hero-owe:#FFB98A;
  --danger:#FF8A92; --shadow:0 1px 0 rgba(255,255,255,.03); --glass:rgba(18,20,27,.86);
  --tabbar:#252B44; --tab-ink:#A9B0C8; --tab-on:#8EA8FF; --tab-on-ink:#0E1430; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:15px; -webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding-inline:18px; padding-block:20px 120px}
h1{margin:0; font-family:var(--display); font-size:32px; font-weight:700; letter-spacing:-.4px; line-height:1.1; text-wrap:balance}
h2{margin:0; font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-.2px; text-wrap:balance}
.paper{background-color:var(--hero); background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size:16px 16px; background-position:-1px -1px}
.week{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.week button{min-height:66px; border:1px solid var(--line); background:var(--surface); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 0; color:var(--ink); box-shadow:var(--shadow)}
.week .wd{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px}
.week .dn{font-size:18px; font-weight:800}
.week .wdot{width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:0}
.week .has .wdot{opacity:1}
.week button.today .dn{color:var(--accent)}
.week button[aria-pressed="true"]{background:var(--hero); border-color:var(--hero); color:var(--on-hero)}
.week button[aria-pressed="true"] .wd{color:var(--hero-muted)}
.week button[aria-pressed="true"] .dn{color:var(--on-hero)}
.week button[aria-pressed="true"] .wdot{background:var(--hero-owe)}
.tl{display:flex; flex-direction:column; gap:10px}
.tli{display:grid; grid-template-columns:44px 14px minmax(0,1fr); gap:8px; align-items:center}
.tli .tt{display:flex; flex-direction:column; align-items:flex-end; font-size:15px; font-weight:800}
.tli .tt small{font-size:11px; font-weight:600; color:var(--muted)}
.rail{align-self:stretch; position:relative; display:flex; align-items:center; justify-content:center}
.rail::before{content:''; position:absolute; left:50%; transform:translateX(-50%); top:-10px; bottom:-10px; width:2px; background:var(--line)}
.tli:first-child .rail::before{top:50%}
.tli:last-child .rail::before{bottom:50%}
.tli:only-child .rail::before{display:none}
.rail .dot{position:relative; width:12px; height:12px; border-radius:50%; background:var(--bg); border:2px solid var(--muted)}
.rail .dot.done{background:var(--ok); border-color:var(--ok)}
.rail .dot.next{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.rail .dot.off{border-color:var(--line)}
.tli.is-next .tt{color:var(--accent)}
.tli .lcard{align-items:center; gap:10px}
.tli .lcard .name, .tli .lcard .sub{white-space:normal; overflow:visible; line-height:1.3}
.tli .lcard .chip{font-size:11px; padding:3px 8px}
[hidden]{display:none !important}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .bf{fill:var(--accent)}
.chart .bf.dim{opacity:.32}
.chart .base{stroke:var(--line); stroke-width:1}
.chart .avg{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 4}
.chart text{fill:var(--muted); font-family:var(--f); font-size:11px}
.chart text.sel{fill:var(--ink); font-weight:800}
.chart text.val{fill:var(--ink); font-weight:800; font-size:12px}
.chart g[data-act]{cursor:pointer}
.chart .ln{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chart .pt{fill:var(--accent); stroke:var(--surface); stroke-width:2}
.chart .gl{stroke:var(--line); stroke-width:1}
.count{color:var(--on-hero); border-radius:20px; padding:16px; display:flex; gap:14px; align-items:center}
.count .big{font-size:34px; font-weight:800; line-height:1}
.count .k{font-size:12px; color:var(--hero-muted)}
.trow{display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.trow .sc{font-weight:800; font-size:16px; white-space:nowrap}
.xbtn{width:44px; height:44px; border:none; background:none; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; border-radius:12px; flex:none}
.search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0 6px 0 14px; box-shadow:var(--shadow); color:var(--muted)}
.mic{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; flex:none; cursor:pointer}
.mic[aria-pressed="true"]{background:var(--danger); color:#FFFFFF; border-color:transparent; animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 7px rgba(163,34,43,.18)}}
@media (prefers-reduced-motion: reduce){ .mic[aria-pressed="true"]{animation:none} }
.field > .flab{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; margin-bottom:-4px}
.search .mic{border:none; background:none; width:40px}
.prep{display:flex; flex-direction:column; gap:8px}
.prep .pl{display:flex; gap:10px; font-size:14px; line-height:1.45}
.prep .pl b{flex:none; width:92px; color:var(--muted); font-weight:600; font-size:13px}
.field .search input{border:none; background:none; padding:0; min-height:46px; border-radius:0}
.search.sticky{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 8px); z-index:4}
.picker{max-height:264px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.picker .opt{display:flex; align-items:center; gap:12px; min-height:56px; padding:6px 12px; border-top:1px solid var(--line); cursor:pointer}
.picker .opt:first-child{border-top:none}
.picker .opt input{position:absolute; opacity:0; pointer-events:none}
.picker .opt:has(input:checked){background:var(--accent-soft)}
.picker .opt .tick{margin-left:auto; color:var(--accent); opacity:0}
.picker .opt:has(input:checked) .tick{opacity:1}
.picker .opt:has(input:focus-visible){outline:3px solid var(--accent); outline-offset:-3px}
.search:focus-within{outline:3px solid var(--accent); outline-offset:1px}
.search input{border:none; background:none; flex:1; min-width:0; min-height:50px; outline:none; color:var(--ink)}
.syl{display:flex; align-items:center; gap:10px; min-height:46px; border-top:1px solid var(--line)}
.syl label{flex:1; min-width:0; display:flex; align-items:center; gap:12px; min-height:46px; cursor:pointer}
.syl input[type=checkbox]{width:22px; height:22px; accent-color:var(--ok); flex:none}
.syl.done label span{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line)}
.addrow{display:flex; gap:8px}
.addrow input{flex:1; min-width:0; min-height:46px; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:0 12px}
.pausebar{background:var(--owe-soft); color:var(--owe); border-radius:16px; padding:12px 12px 12px 14px; display:flex; gap:10px; align-items:center; justify-content:space-between}
.stat3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stat3 > div{display:flex; flex-direction:column; gap:2px}
.stat3 .k{font-size:12px; color:var(--muted)}
.stat3 .v{font-size:17px; font-weight:800}
.eyebrow{font-size:14px; font-weight:500; color:var(--muted)}
.label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:10px; align-items:center}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow)}
button.card, a.card{display:block; width:100%; text-align:left; font:inherit; color:inherit; text-decoration:none; transition:transform .12s ease}
button.card:active, .btn:active, .tile:active{transform:scale(.985)}
button.card.lcard, .lcard{display:flex; gap:12px; align-items:center; padding:12px 14px}
.lcard .lt{width:46px; flex:none; display:flex; flex-direction:column; gap:1px}
.lcard .lt .t{font-size:16px; font-weight:800}
.lcard .lt .dur{font-size:11px; font-weight:600; color:var(--muted)}
.lcard .who{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.lcard .name{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lcard .sub{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lcard.is-next{border:2px solid var(--accent); padding:11px 13px}
.lcard.is-next .t{color:var(--accent)}
.av{border-radius:14px; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; letter-spacing:.3px}
.summary{color:var(--on-hero); border-radius:22px; padding:18px 6px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr))}
.summary > *{display:flex; flex-direction:column; gap:3px; padding:0 12px; border:none; background:none; color:inherit; font:inherit; text-align:left}
.summary > * + *{border-left:1px solid rgba(255,255,255,.14)}
.summary .k{font-size:12px; color:var(--hero-muted)}
.summary .v{font-size:22px; font-weight:800; white-space:nowrap}
.summary .owe .v{color:var(--hero-owe)}
.sec{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px}
.sec .label{margin:0}
.tile{border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); background:var(--surface); text-align:left}
.tile .big{font-size:26px; font-weight:800}
.tile.owe{background:var(--owe-soft); border-color:transparent; color:var(--owe)}
.chip{display:inline-flex; align-items:center; white-space:nowrap; font-size:12px; font-weight:700; border-radius:999px; padding:4px 10px}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.owe{background:var(--owe-soft); color:var(--owe)}
.chip.next{background:var(--accent); color:var(--on-accent)}
.chip.off{background:var(--line); color:var(--muted)}
.lesson{display:flex; gap:12px; align-items:flex-start}
.lesson .t{width:48px; font-weight:700; color:var(--muted); font-size:15px}
.lesson .who{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.lesson .name{font-size:16px; font-weight:700}
.lesson .sub{font-size:13px; color:var(--muted)}
.card.is-next{border:2px solid var(--accent)}
.card.is-next .t{color:var(--accent)}
.card.is-off{opacity:.6}
.btn{min-height:48px; border-radius:14px; border:1px solid var(--line); background:var(--surface); font-weight:600; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:700}
.btn.soft{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:700}
.btn.good{background:var(--ok); color:var(--surface); border-color:transparent; font-weight:700}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:44px; font-size:14px}
.datebar{display:flex; align-items:center; gap:6px}
.iconbtn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; color:var(--ink)}
.fab{position:fixed; right:max(18px, calc(50% - 262px)); bottom:calc(88px + env(safe-area-inset-bottom,0px)); height:56px; padding:0 20px 0 16px; gap:8px; border-radius:18px; border:none; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; box-shadow:0 10px 24px rgba(31,79,209,.32); z-index:5}
.fab:active{transform:scale(.97)}
nav.tabs{position:fixed; left:0; right:0; bottom:0; padding:0 14px calc(12px + env(safe-area-inset-bottom,0px)); z-index:6; pointer-events:none}
nav.tabs .in{pointer-events:auto; max-width:520px; margin:0 auto; display:flex; gap:2px; padding:6px; background:var(--tabbar); border-radius:28px; box-shadow:0 14px 32px rgba(20,24,50,.30), 0 2px 6px rgba(20,24,50,.16)}
nav.tabs button{position:relative; flex:1 1 0; min-width:0; min-height:52px; border:none; background:none; color:var(--tab-ink); border-radius:22px; display:flex; align-items:center; justify-content:center; gap:7px; padding:0 8px; font-size:14px; font-weight:700; transition:flex-grow .28s cubic-bezier(.3,.7,.2,1), background-color .2s, color .2s}
nav.tabs button:active{transform:scale(.96)}
nav.tabs button[aria-current="page"]{flex-grow:2.7; background:var(--tab-on); color:var(--tab-on-ink)}
nav.tabs .ti{position:relative; display:flex; flex:none}
nav.tabs .tlab{display:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
nav.tabs button[aria-current="page"] .tlab{display:block}
nav.tabs .badge{position:absolute; top:-6px; right:-9px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--hero-owe); color:#3A1A06; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--tabbar)}
nav.tabs button[aria-current="page"] .badge{display:none}
@media (prefers-reduced-motion: reduce){ nav.tabs button{transition:none} }
.hero{color:var(--on-hero); border-radius:22px; padding:18px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.hero .k{font-size:13px; color:var(--hero-muted)}
.hero .v{font-size:28px; font-weight:800}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{min-height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; padding:0 6px; text-align:center}
.seg input:checked + label{background:var(--ok); color:var(--surface); font-weight:700}
.seg input:focus-visible + label{outline:3px solid var(--accent); outline-offset:-3px}
.tabs2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); background:var(--line); border-radius:12px; padding:4px; gap:4px}
.tabs2 button{min-height:40px; border:none; border-radius:9px; background:transparent; font-size:14px; color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:700}
.field{display:flex; flex-direction:column; gap:6px}
.field > span{font-size:13px; font-weight:700; color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 12px; width:100%}
.field textarea{min-height:110px; resize:vertical; line-height:1.5}
.msg{min-height:230px !important; border-radius:18px 18px 18px 6px !important}
.sheet{position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:20; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:12px 40px}
.sheethead{display:flex; align-items:center; gap:8px; min-height:52px; position:sticky; top:0; z-index:3; margin-inline:-18px; padding-inline:18px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.back{min-height:44px; border:none; background:none; color:var(--accent); font-weight:700; padding:0 4px 0 0; display:inline-flex; align-items:center; gap:2px}
.avatar{width:54px; height:54px; border-radius:18px; color:#fff; font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
.bar{height:10px; border-radius:999px; background:var(--line); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--accent); border-radius:999px}
.hist{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hist .d{width:56px; font-size:13px; font-weight:700; color:var(--muted); flex:none}
.banner{background:var(--accent-soft); color:var(--ink); border-radius:16px; padding:10px 10px 10px 14px; font-size:14px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.empty{text-align:center; padding:28px 12px; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + env(safe-area-inset-bottom,0px)); background:var(--hero); color:var(--on-hero); padding:12px 16px; border-radius:12px; font-weight:600; z-index:40; max-width:calc(100% - 32px); text-align:center}
.cal{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 8px 8px}
.cal .wd, .cal .days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px}
.cal .wd div{text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:4px 0 6px; text-transform:uppercase; letter-spacing:.4px}
.cal .days button{min-height:52px; border:none; background:none; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; padding:6px 0 4px; color:var(--ink); font-size:15px; font-weight:600}
.cal .days button.out{color:var(--muted); opacity:.45}
.cal .days button.today .n{color:var(--accent); font-weight:800}
.cal .days button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.cal .days button[aria-pressed="true"] .n{color:var(--on-accent)}
.cal .dots{display:flex; gap:3px; min-height:6px; justify-content:center; flex-wrap:wrap; max-width:30px}
.cal .dots i{width:6px; height:6px; border-radius:50%; display:block}
.cal .days button[aria-pressed="true"] .dots i{box-shadow:0 0 0 1.5px var(--on-accent)}
.cal .more{font-size:9px; font-weight:800; line-height:6px}
.remind{background:var(--accent); color:var(--on-accent); border-radius:16px; padding:14px; display:flex; gap:12px; align-items:flex-start}
.remind b{display:block; font-size:15px}
.remind .r-sub{font-size:13px; opacity:.9; line-height:1.45}
.remind a{color:inherit}
.addr{color:var(--accent); font-weight:600; text-decoration:none}
.check{display:flex; gap:10px; align-items:center; min-height:44px}
.check input{width:22px; height:22px; accent-color:var(--accent)}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(16px); opacity:.6}to{transform:none; opacity:1}} }
</style>
</head>
<body>


<div id="main"></div>
<button class="fab" id="fab" data-act="add-lesson">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg><span id="fabl">Μάθημα</span>
</button>
<nav class="tabs" aria-label="Κύριο μενού"><div class="in" id="tabs"></div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
const KEY = 'idiaitera.v1';
const COLORS = ['#1F4FD1','#0E6656','#7A3FC4','#B4460F','#B0305C','#2F6F2A'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const money = (n) => Math.round(n).toLocaleString('el-GR') + '€';
const longDate = (s) => parseYmd(s).toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'});
const shortDate = (s) => parseYmd(s).toLocaleDateString('el-GR', {day:'numeric', month:'short'});
const first = (name) => String(name||'').trim().split(/\s+/)[0] || '';
const initials = (name) => String(name||'').trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();

/* ---------- storage (this device only) ---------- */
function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function seed(){
  const t = today();
  const st = (o) => Object.assign({id:uid(), parentPhone:'', address:'', pkg:0, color:COLORS[0]}, o);
  const maria = st({name:'Μαρία Κωνσταντίνου', g:'f', subject:'Μαθηματικά', grade:'Γ\' Λυκείου', parentName:'κα Κωνσταντίνου', price:25, address:'Τσιμισκή 45, 3ος όροφος, Θεσσαλονίκη', color:COLORS[2]});
  const nikos = st({name:'Νίκος Παπαδόπουλος', g:'m', subject:'Φυσική', grade:'Β\' Λυκείου', parentName:'κα Παπαδοπούλου', price:25, pkg:8, address:'Εγνατίας 120, Θεσσαλονίκη', color:COLORS[0]});
  const eleni = st({name:'Ελένη Δημητρίου', g:'f', subject:'Αγγλικά', grade:'Proficiency', parentName:'κ. Δημητρίου', price:30, address:'Online (Zoom)', color:COLORS[1]});
  const giorgos = st({name:'Γιώργος Σταύρου', g:'m', subject:'Άλγεβρα', grade:'Α\' Λυκείου', parentName:'κα Σταύρου', price:25, address:'Βασ. Όλγας 88, Καλαμαριά', color:COLORS[3]});
  const L = [];
  const les = (s, d, time, status, extra) => L.push(Object.assign({id:uid(), studentId:s.id, date:addDays(t,d), time, status, price:s.price, topic:'', focus:'', hw:'', nextHw:'', note:''}, extra||{}));
  les(maria,-7,'15:00','done',{topic:'Παράγωγοι, επανάληψη', focus:'good', hw:'yes'});
  les(maria,-3,'15:00','done',{topic:'Όρια, εισαγωγή', focus:'mid', hw:'yes'});
  les(maria,0,'15:00','done',{topic:'Όρια συναρτήσεων (Κεφ. 2)', focus:'good', hw:'yes', nextHw:'Ασκήσεις 4–9, σελ. 58'});
  les(nikos,-21,'17:00','done',{topic:'Κυκλική κίνηση', focus:'mid', hw:'no', note:'Δεν είχε κάνει την εργασία.'});
  les(nikos,-17,'17:00','done',{topic:'Οριζόντια βολή', focus:'good', hw:'yes', note:'Διαγώνισμα 16/20. Λάθη στις μονάδες.'});
  les(nikos,-14,'17:00','done',{topic:'Ορμή', focus:'good', hw:'yes'});
  les(nikos,-10,'17:00','done',{topic:'Κρούσεις', focus:'good', hw:'yes'});
  les(nikos,-7,'17:00','done',{topic:'Ορμή και κρούσεις (Κεφ. 2)', focus:'good', hw:'yes', note:'Καλή κατανόηση, θέλει εξάσκηση στις πλάγιες κρούσεις.'});
  les(nikos,0,'17:00','scheduled');
  les(eleni,-7,'18:30','done',{topic:'Reading, Paper 1', focus:'good', hw:'yes'});
  les(eleni,0,'18:30','scheduled');
  les(giorgos,-21,'20:00','done',{topic:'Ταυτότητες', focus:'mid', hw:'yes'});
  les(giorgos,-14,'20:00','done',{topic:'Εξισώσεις 1ου βαθμού', focus:'mid', hw:'no'});
  les(giorgos,-7,'20:00','done',{topic:'Ανισώσεις', focus:'good', hw:'yes'});
  les(giorgos,-3,'20:00','done',{topic:'Απόλυτες τιμές', focus:'good', hw:'yes'});
  les(giorgos,0,'20:00','scheduled');
  les(maria,2,'15:00','scheduled');
  les(nikos,3,'17:00','scheduled');
  les(giorgos,4,'20:00','scheduled');
  const P = [
    {id:uid(), studentId:nikos.id, amount:200, date:addDays(t,-21), note:'Πακέτο 8 μαθημάτων'},
    {id:uid(), studentId:eleni.id, amount:30, date:addDays(t,-7), note:''}
  ];
  const tst = (d, title, score, max) => ({id:uid(), date:addDays(t,d), title, score, max});
  nikos.tests = [tst(-40,'Κινηματική',13,20), tst(-25,'Οριζόντια βολή',16,20), tst(-10,'Ορμή',17,20)];
  maria.tests = [tst(-30,'Παράγωγοι',72,100), tst(-6,'Όρια',81,100)];
  const syl = (titles, nDone) => titles.map((title, i) => ({id:uid(), title, done:i < nDone}));
  nikos.syllabus = syl(['Οριζόντια βολή','Κυκλική κίνηση','Ορμή','Κρούσεις','Νόμοι των αερίων','Κινητική θεωρία','Θερμοδυναμική','Ηλεκτρικό πεδίο','Δυναμικό','Κίνηση φορτίων σε πεδίο'], 4);
  maria.syllabus = syl(['Συναρτήσεις','Όρια','Συνέχεια','Παράγωγοι','Εφαρμογές παραγώγων','Ολοκληρώματα'], 2);
  eleni.syllabus = syl(['Reading','Writing: essay','Writing: letter','Listening','Speaking','Grammar & Vocabulary'], 3);
  const yr = new Date().getMonth() >= 6 ? new Date().getFullYear() + 1 : new Date().getFullYear();
  maria.examName = 'Πανελλαδικές'; maria.examDate = yr + '-06-02';
  nikos.examName = 'Τελικές εξετάσεις'; nikos.examDate = yr + '-05-25';
  eleni.examName = 'Proficiency'; eleni.examDate = addDays(t, 63);
  // earlier months: paid weekly lessons, so the income chart has history (balances stay unchanged)
  const hist = [[maria,'15:00',1],[nikos,'17:00',2],[eleni,'18:30',4],[giorgos,'20:00',5]];
  for (let k = 5; k >= 1; k--) {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() - k);
    hist.forEach(([s, time, dow], si) => {
      const n = k === 1 ? 2 : 3 + ((k + si) % 2);
      for (let w = 0; w < n; w++) L.push({id:uid(), studentId:s.id, date:ymd(new Date(base.getFullYear(), base.getMonth(), 2 + dow + w*7)), time, status:'done', price:s.price, topic:'', focus:'good', hw:'yes', nextHw:'', note:''});
      P.push({id:uid(), studentId:s.id, amount:n*s.price, date:ymd(new Date(base.getFullYear(), base.getMonth(), k === 1 ? 14 : 26)), note:''});
    });
  }
  return {v:1, demo:true, teacher:'', students:[maria,nikos,eleni,giorgos], lessons:L, payments:P};
}
function blank(){ return {v:1, demo:false, teacher:'', students:[], lessons:[], payments:[]}; }

let S = load();
if (!S || !Array.isArray(S.students)) { S = seed(); save(); }

/* ---------- money logic ---------- */
function stu(id){ return S.students.find(s => s.id === id); }
function balance(s){
  const charged = S.lessons.filter(l => l.studentId === s.id && l.status === 'done').reduce((a,l) => a + (Number(l.price)||0), 0);
  const paid = S.payments.filter(p => p.studentId === s.id).reduce((a,p) => a + (Number(p.amount)||0), 0);
  return paid - charged; // >0 prepaid credit, <0 owes
}
function owes(s){ const b = balance(s); return b < 0 ? -b : 0; }
function creditLessons(s){ const b = balance(s); return (b > 0 && s.price > 0) ? Math.floor(b / s.price) : 0; }
function totalOwed(){ return S.students.reduce((a,s) => a + owes(s), 0); }
function collectedThisMonth(){ const m = today().slice(0,7); return S.payments.filter(p => p.date.slice(0,7) === m).reduce((a,p) => a + (Number(p.amount)||0), 0); }

/* ---------- message text ---------- */
function art(s){ return s.g === 'f' ? 'την' : 'τον'; }
function acc(name){ const f = first(name); return /ς$/.test(f) ? f.slice(0,-1) : f; }
const MONTH_ACC = ['Ιανουάριο','Φεβρουάριο','Μάρτιο','Απρίλιο','Μάιο','Ιούνιο','Ιούλιο','Αύγουστο','Σεπτέμβριο','Οκτώβριο','Νοέμβριο','Δεκέμβριο'];
function monthAcc(ym){ return MONTH_ACC[Number(ym.split('-')[1]) - 1]; }
const MONTH_GEN = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
function monthGen(ym){ return MONTH_GEN[Number(ym.split('-')[1]) - 1]; }
function reportMonth(){ const d = new Date(); if (d.getDate() <= 5) d.setDate(0); return ymd(d).slice(0,7); }
function monthStats(s, ym){
  const ls = S.lessons.filter(l => l.studentId === s.id && l.date.slice(0,7) === ym);
  const done = ls.filter(l => l.status === 'done').sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  return {done, cancelled: ls.filter(l => l.status === 'cancelled').length};
}
function monthReport(s, ym){
  const {done, cancelled} = monthStats(s, ym);
  const L = [];
  L.push('Καλησπέρα' + (s.parentName ? ' ' + s.parentName : '') + '! Μια σύνοψη για τα μαθήματα με ' + art(s) + ' ' + acc(s.name) + ' τον ' + monthAcc(ym) + ':');
  if (!done.length) {
    L.push('Δεν έγιναν μαθήματα αυτόν τον μήνα.');
  } else {
    const b = [];
    b.push('• Μαθήματα: ' + done.length + (cancelled ? ' (' + cancelled + (cancelled === 1 ? ' ακυρώθηκε)' : ' ακυρώθηκαν)') : ''));
    const topics = [...new Set(done.map(l => (l.topic || '').trim()).filter(Boolean))];
    if (topics.length) b.push('• Καλύψαμε: ' + topics.join(', '));
    const hw = done.filter(l => l.hw === 'yes' || l.hw === 'no');
    if (hw.length) { const y = hw.filter(l => l.hw === 'yes').length; b.push('• Εργασίες: ' + (y === hw.length ? 'τις έκανε όλες (' + y + '/' + hw.length + ')' : 'έκανε τις ' + y + ' από τις ' + hw.length)); }
    const fs = done.filter(l => l.focus);
    if (fs.length) {
      const score = {good:3, mid:2, low:1};
      const avg = fs.reduce((a,l) => a + score[l.focus], 0) / fs.length;
      let t = '• Συγκέντρωση: ' + (avg >= 2.6 ? 'πολύ καλή' : avg >= 1.8 ? 'μέτρια, με περιθώριο βελτίωσης' : 'χαμηλή, θέλει προσοχή');
      if (fs.length >= 3) { const a = score[fs[0].focus], z = score[fs[fs.length-1].focus]; if (z > a) t += ', με βελτίωση στα τελευταία μαθήματα'; if (z < a) t += ', λίγο πιο πεσμένη στα τελευταία μαθήματα'; }
      b.push(t);
    }
    const sy = s.syllabus || [];
    if (sy.length) { const dn = sy.filter(x => x.done).length; b.push('• Ύλη: καλύφθηκε το ' + Math.round(dn / sy.length * 100) + '% (' + dn + ' από ' + sy.length + ' ενότητες)'); }
    L.push(b.join('\n'));
  }
  const nxt = S.lessons.filter(l => l.studentId === s.id && l.status === 'scheduled' && l.date >= today()).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))[0];
  if (nxt) L.push('Επόμενο μάθημα: ' + parseYmd(nxt.date).toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'}) + ', ' + nxt.time + '.');
  const o = owes(s), c = creditLessons(s);
  if (o > 0) L.push('Υπόλοιπο μαθημάτων: ' + money(o) + '.');
  else if (s.pkg > 0) L.push(c > 0 ? 'Απομένουν ' + c + ' μαθήματα από το πακέτο.' : 'Το πακέτο ολοκληρώθηκε, οπότε το επόμενο μάθημα ξεκινά νέο πακέτο.');
  const tests = (s.tests || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const mt = tests.filter(x => x.date.slice(0,7) === ym);
  if (mt.length) {
    L.push('Διαγωνίσματα:\n' + mt.map(x => { const i = tests.indexOf(x), prev = i > 0 ? tests[i-1] : null;
      const p = Math.round(x.score / x.max * 100), pp = prev ? Math.round(prev.score / prev.max * 100) : null;
      return '• ' + x.title + ': ' + x.score + '/' + x.max + (pp != null ? (p > pp ? ' (ανέβηκε από ' + prev.score + '/' + prev.max + ')' : p < pp ? ' (το προηγούμενο ήταν ' + prev.score + '/' + prev.max + ')' : '') : ''); }).join('\n'));
  }
  if (s.examDate && s.examDate >= today()) { const w = Math.ceil((parseYmd(s.examDate) - parseYmd(today())) / (7*86400000)); L.push('Μέχρι ' + (s.examName ? 'τις ' + s.examName : 'τις εξετάσεις') + ' μένουν ' + w + ' εβδομάδες.'); }
  L.push('Ευχαριστώ για τη συνεργασία!' + (S.teacher ? '\n' + S.teacher : ''));
  return L.join('\n\n');
}
function monthEndNudge(){
  const d = new Date(), last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  if (!S.students.length || !(d.getDate() >= last - 2 || d.getDate() <= 3)) return '';
  return '<div class="banner" style="flex-wrap:nowrap"><span style="min-width:0">Τέλος μήνα: στείλε στους γονείς τη <b>σύνοψη του ' + monthGen(reportMonth()) + '</b></span><button class="btn sm" style="min-height:40px;padding:0 12px;font-size:13px;background:var(--surface);color:var(--accent);border-color:transparent;white-space:nowrap" data-act="reports">Αναφορές</button></div>';
}
function his(s){ return s.g === 'f' ? 'της' : 'του'; }
function lessonMessage(l, withMoney){
  const s = stu(l.studentId); if (!s) return '';
  const lines = [];
  lines.push('Καλησπέρα' + (s.parentName ? ' ' + s.parentName : '') + '!');
  let p = 'Σήμερα με ' + art(s) + ' ' + acc(s.name) + ' δουλέψαμε' + (l.topic ? ': ' + l.topic + '.' : '.');
  if (l.focus === 'good') p += ' Ήταν πολύ ' + (s.g === 'f' ? 'συγκεντρωμένη' : 'συγκεντρωμένος') + '.';
  if (l.focus === 'mid') p += ' Η συγκέντρωση ήταν μέτρια.';
  if (l.focus === 'low') p += ' Δυσκολεύτηκε να συγκεντρωθεί σήμερα.';
  if (l.hw === 'yes') p += ' Είχε κάνει την εργασία ' + his(s) + '.';
  if (l.hw === 'no') p += ' Δεν είχε κάνει την εργασία ' + his(s) + '.';
  lines.push(p);
  if (l.nextHw) lines.push('Για την επόμενη φορά: ' + l.nextHw + '.');
  if (withMoney) {
    const o = owes(s), c = creditLessons(s);
    if (o > 0) lines.push('Υπόλοιπο μαθημάτων: ' + money(o) + '.');
    else if (s.pkg > 0) lines.push(c > 0 ? ('Απομένουν ' + c + ' μαθήματα από το πακέτο.') : 'Το πακέτο ολοκληρώθηκε.');
  }
  if (S.teacher) lines.push(S.teacher);
  return lines.join('\n\n');
}
function reminderMessage(s){
  const o = owes(s), n = s.price > 0 ? Math.round(o / s.price) : 0;
  return 'Καλησπέρα' + (s.parentName ? ' ' + s.parentName : '') + '! Μια μικρή υπενθύμιση για τα μαθήματα ' + (s.g === 'f' ? 'της ' : 'του ') + first(s.name) +
    ': ' + (n > 0 ? n + (n === 1 ? ' μάθημα, ' : ' μαθήματα, ') : '') + 'σύνολο ' + money(o) + '. Ευχαριστώ πολύ!' + (S.teacher ? '\n\n' + S.teacher : '');
}

/* ---------- UI state ---------- */
const UI = { tab:'today', day:today(), owedTab:'owe', sheet:null, confirmWipe:false, calMonth:today().slice(0,7), calSel:today() };
const TABS = [
  ['today','Σήμερα','<path d="M4 6h16M4 11h16M4 16h10"></path>'],
  ['calendar','Ημερολόγιο','<rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path>'],
  ['students','Μαθητές','<circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14.4c1.5.7 2.4 2.3 2.6 4.6"></path>'],
  ['owed','Έσοδα','<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path>'],
  ['settings','Ρυθμίσεις','<circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"></path>']
];
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

/* ---------- main tabs ---------- */
function renderTabs(){
  const nOwe = S.students.filter(s => owes(s) > 0).length;
  $('#tabs').innerHTML = TABS.map(([k,label,icon]) => {
    const badge = (k === 'owed' && nOwe) ? '<span class="badge num" aria-hidden="true">'+nOwe+'</span>' : '';
    return '<button data-act="tab" data-k="'+k+'" aria-label="'+label+(badge?', '+nOwe+' οφειλές':'')+'"'+(UI.tab===k?' aria-current="page"':'')+'><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(UI.tab===k?'2.2':'1.9')+'" stroke-linecap="round" stroke-linejoin="round">'+icon+'</svg>'+badge+'</span><span class="tlab">'+label+'</span></button>';
  }).join('');
  $('#fab').hidden = !(UI.tab === 'today' || UI.tab === 'students' || UI.tab === 'calendar');
  $('#fabl').textContent = UI.tab === 'students' ? 'Μαθητής' : 'Μάθημα';
  $('#fab').setAttribute('aria-label', UI.tab === 'students' ? 'Νέος μαθητής' : 'Νέο μάθημα');
  $('#fab').dataset.act = UI.tab === 'students' ? 'new-student' : 'add-lesson';
}
function demoBanner(){
  return S.demo ? '<div class="banner" style="flex-wrap:nowrap"><span style="min-width:0">Βλέπεις <b>παραδείγματα</b></span><button class="btn sm" style="min-height:40px;padding:0 12px;font-size:13px;background:var(--surface);color:var(--accent);border-color:transparent;white-space:nowrap" data-act="clear-demo">Ξεκίνα από το μηδέν</button></div>' : '';
}
/* ---------- dictation (speech to text) ---------- */
const MIC_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>';
function mic(target){ return '<button type="button" class="mic" data-act="dictate" data-target="'+target+'" aria-label="Υπαγόρευση με φωνή" aria-pressed="'+(UI.dictating===target)+'">'+MIC_ICON+'</button>'; }
let REC = null;
function refreshMic(){ document.querySelectorAll('[data-act="dictate"]').forEach(b => b.setAttribute('aria-pressed', UI.dictating === b.dataset.target)); }

function dictate(target){

function timeWords(t){
  let [h, m] = t.split(':').map(Number); let pre = '';

  const h12 = h % 12 || 12, part = h < 12 ? 'το πρωί' : h < 15 ? 'το μεσημέρι' : h < 20 ? 'το απόγευμα' : 'το βράδυ';
  return 'στις ' + h12 + pre + ' ' + part;
}

function testsCard(s){
  const tests = (s.tests || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  let chart = '';
  if (tests.length >= 2) {
    const W = 300, H = 96, pl = 6, pr = 40, pt = 12, pb = 10, pw = W - pl - pr, ph = H - pt - pb;
    const pts = tests.map((x, i) => [pl + (tests.length === 1 ? pw/2 : i * pw / (tests.length - 1)), pt + ph - (Math.min(100, x.score / x.max * 100) / 100) * ph]);
    const lastP = Math.round(tests[tests.length-1].score / tests[tests.length-1].max * 100);
    chart = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Πορεία βαθμών">' +
      '<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'"></line><line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ph/2)+'" y2="'+(pt+ph/2)+'"></line><line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ph)+'" y2="'+(pt+ph)+'"></line>' +
      '<text x="'+(W-pr+6)+'" y="'+(pt+4)+'">100%</text><text x="'+(W-pr+6)+'" y="'+(pt+ph/2+4)+'">50%</text>' +
      '<polyline class="ln" points="'+pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"></polyline>' +

document.addEventListener('click', (e) => {

  if (act !== 'dictate' && UI.dictating && (act === 'tab' || act === 'close')) stopDictation();
  switch (act) {
    case 'dictate': e.preventDefault(); dictate(b.dataset.target); break;
    case 'tab': UI.tab = b.dataset.k; UI.confirmWipe = false; if (UI.sheet) { UI.sheet = null; UI.stack = []; } render(); window.scrollTo(0,0); break;
    case 'tab-day': UI.tab = 'today'; UI.day = b.dataset.day; closeAll(); break;

      const ta = $('#msgtext'); const txt = ta ? ta.value : '';
      const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast('Επίλεξε το κείμενο και αντέγραψέ το'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Αντιγράφηκε. Επικόλλησέ το στο Viber.'), fallback); } catch(err) { fallback(); }
      break; }
    case 'del-student': UI.confirmDel = true; renderSheet(); break;
    case 'del-student-no': UI.confirmDel = false; renderSheet(); break;
    case 'del-student-yes': S.students = S.students.filter(s => s.id !== id); S.lessons = S.lessons.filter(l => l.studentId !== id); S.payments = S.payments.filter(p => p.studentId !== id); save(); closeAll(); toast('Ο μαθητής διαγράφηκε'); break;
    case 'owed-tab': UI.owedTab = b.dataset.k; render(); break;
    case 'clear-demo': S = blank(); save(); UI.day = today(); render(); toast('Έτοιμο. Πρόσθεσε τον πρώτο σου μαθητή.'); break;
    case 'load-demo': S = seed(); save(); UI.day = today(); render(); toast('Φορτώθηκαν τα παραδείγματα'); break;
    case 'wipe': UI.confirmWipe = true; render(); break;
    case 'wipe-cancel': UI.confirmWipe = false; render(); break;
    case 'wipe-yes': S = blank(); save(); UI.confirmWipe = false; render(); toast('Όλα διαγράφηκαν'); break;
    case 'backup': {
      const txt = JSON.stringify(S);
      try { navigator.clipboard.writeText(txt).then(() => toast('Αντιγράφηκε. Στείλ\' το στον εαυτό σου (π.χ. email).'), () => toast('Δεν επιτράπηκε η αντιγραφή σε αυτή την προβολή')); } catch(err) { toast('Δεν επιτράπηκε η αντιγραφή σε αυτή την προβολή'); }
      break; }
  }
});
document.addEventListener('change', (e) => {
  const cb = e.target.closest('input[data-syl]'); if (!cb) return;
  const s = stu(cb.dataset.sid); if (!s) return;
  const x = (s.syllabus || []).find(y => y.id === cb.dataset.syl); if (!x) return;
  x.done = cb.checked; save();
  const sh = $('#sheet'), top = sh.scrollTop; renderSheet(); sh.scrollTop = top;
  const f = sh.querySelector('input[data-syl="'+x.id+'"]'); if (f) f.focus({preventScroll:true});
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'al-q') {
    const q = norm(e.target.value).trim(); let shown = 0;
    document.querySelectorAll('.picker .opt').forEach(o => { const ok = !q || o.dataset.k.includes(q); o.hidden = !ok; if (ok) shown++; });
    const none = $('#al-none'); if (none) none.hidden = shown > 0;
    if (shown === 1) { const only = [...document.querySelectorAll('.picker .opt')].find(o => !o.hidden); if (only) only.querySelector('input').checked = true; }
    return;
  }
  if (e.target.id === 'q') { UI.q = e.target.value; const r = $('#qres'); if (r) r.innerHTML = searchResults(); return; }
  if (e.target.id !== 'msgtext') return;
  const t = e.target.value, v = $('#viber-link'), s = $('#sms-link');
  if (v) v.href = 'viber://forward?text=' + encodeURIComponent(t);
  if (s) s.href = s.href.split('?')[0] + '?body=' + encodeURIComponent(t);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const kind = f.dataset.form, id = f.dataset.id;
  if (kind === 'complete') {
    const l = S.lessons.find(x => x.id === id); if (!l) return;
    const wasDone = l.status === 'done';
    Object.assign(l, {topic:(d.topic||'').trim(), focus:d.focus||'', hw:d.hw==='none'?'':(d.hw||''), nextHw:(d.nextHw||'').trim(), note:(d.note||'').trim(), status:'done'});
    const s = stu(l.studentId); if (s && !wasDone) l.price = s.price;
    save(); UI.edit = false;
    if (wasDone) { render(); toast('Αποθηκεύτηκε'); }
    else { UI.sheet = {kind:'msg', arg:{text:lessonMessage(l, true), sid:l.studentId}}; render(); toast('Καταγράφηκε. Στείλε ενημέρωση στον γονιό.'); }
  }
  if (kind === 'add-lesson') {
    const n = Number(d.rep) || 1;
    for (let i = 0; i < n; i++) S.lessons.push({id:uid(), studentId:d.studentId, date:addDays(d.date, i*7), time:d.time, status:'scheduled', price:(stu(d.studentId)||{}).price||0, topic:'', focus:'', hw:'', nextHw:'', note:''});
    save(); UI.day = d.date;
    if (UI.tab === 'calendar') { UI.calSel = d.date; UI.calMonth = d.date.slice(0,7); } else UI.tab = 'today';
    closeAll(); toast(n === 1 ? 'Το μάθημα προστέθηκε' : 'Προστέθηκαν ' + n + ' μαθήματα');
  }
  if (kind === 'student') {
    const rec = {name:(d.name||'').trim(), g:d.g||'m', subject:(d.subject||'').trim(), grade:(d.grade||'').trim(), price:Number(d.price)||0, pkg:Number(d.pkg)||0, parentName:(d.parentName||'').trim(), parentPhone:(d.parentPhone||'').trim(), address:(d.address||'').trim(), examName:(d.examName||'').trim(), examDate:d.examDate||''};
    if (!rec.name) return;
    if (id) { Object.assign(stu(id), rec); save(); closeSheet(); toast('Αποθηκεύτηκε'); }
    else { const s = Object.assign({id:uid(), color:COLORS[S.students.length % COLORS.length]}, rec); S.students.push(s); S.demo = S.demo && true; save(); UI.sheet = null; UI.stack = []; UI.tab = 'students'; openSheet('student', s.id); render(); toast('Ο μαθητής προστέθηκε'); }
  }
  if (kind === 'move') {
    const l = S.lessons.find(x => x.id === id); if (!l) return;
    const s = stu(l.studentId);
    const oldTxt = parseYmd(l.date).getDate() + '/' + (parseYmd(l.date).getMonth()+1) + ', ' + l.time;
    l.date = d.date; l.time = d.time; save();
    UI.day = d.date; UI.calSel = d.date; UI.calMonth = d.date.slice(0,7);
    if (d.notify && s) {
      const txt = 'Καλησπέρα' + (s.parentName ? ' ' + s.parentName : '') + '! Το μάθημα που είχαμε στις ' + oldTxt + ' μεταφέρεται για ' + parseYmd(d.date).toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'}) + ', ' + d.time + '. Ευχαριστώ!' + (S.teacher ? '\n\n' + S.teacher : '');
      UI.sheet = {kind:'msg', arg:{text:txt, sid:s.id, title:'Ενημέρωση αλλαγής'}}; render();
    } else closeSheet();
    toast('Το μάθημα μεταφέρθηκε');
  }
  if (kind === 'syl') {
    const s = stu(id); if (!s) return;
    const titles = String(d.title || '').split('\n').map(t => t.trim()).filter(Boolean);
    if (!titles.length) return;
    s.syllabus = (s.syllabus || []).concat(titles.map(title => ({id:uid(), title, done:false})));
    save(); const sh = $('#sheet'), top = sh.scrollTop; renderSheet(); sh.scrollTop = top;
    const ni = $('#syl-new'); if (ni && titles.length === 1) ni.focus({preventScroll:true});
    toast(titles.length === 1 ? 'Προστέθηκε' : 'Προστέθηκαν ' + titles.length + ' ενότητες');
  }
  if (kind === 'pause') {
    const s = stu(id); if (!s || !d.until) return;
    s.pausedUntil = d.until; let n = 0;
    S.lessons.forEach(l => { if (l.studentId === id && l.status === 'scheduled' && l.date >= today() && l.date < d.until) { l.status = 'cancelled'; l.pausedBy = true; n++; } });
    save();
    if (d.notify) {
      const txt = 'Καλησπέρα' + (s.parentName ? ' ' + s.parentName : '') + '! Όπως είπαμε, κάνουμε μια μικρή παύση στα μαθήματα με ' + art(s) + ' ' + acc(s.name) + '. Ξαναρχίζουμε ' + (parseYmd(d.until).getDay() === 6 ? 'το ' : 'την ') + parseYmd(d.until).toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'}) + '. Ευχαριστώ!' + (S.teacher ? '\n\n' + S.teacher : '');
      UI.sheet = {kind:'msg', arg:{text:txt, sid:id, title:'Ενημέρωση παύσης'}}; render();
    } else closeSheet();
    toast('Παύση' + (n ? ': ' + n + ' μαθήματα σε αναμονή' : ''));
  }
  if (kind === 'test') {
    const s = stu(id); if (!s) return;
    const score = Number(d.score), max = Number(d.max);
    if (!(max > 0) || !(score >= 0)) return;
    s.tests = s.tests || []; s.tests.push({id:uid(), date:d.date || today(), title:(d.title||'').trim(), score, max});
    save(); closeSheet(); toast('Καταγράφηκε ' + score + '/' + max);
  }
  if (kind === 'pay') {
    const amt = Number(d.amount); if (!(amt > 0)) return;
    S.payments.push({id:uid(), studentId:id, amount:amt, date:d.date || today(), note:(d.note||'').trim()});
    save(); closeSheet(); toast('Καταγράφηκε πληρωμή ' + money(amt));
  }
  if (kind === 'remind') { S.remindHours = Number(d.remindHours) || 2; save(); toast('Υπενθύμιση ' + hoursLabel(remindHours()) + ' πριν'); }
  if (kind === 'teacher') { S.teacher = (d.teacher||'').trim(); save(); toast('Αποθηκεύτηκε'); }
  if (kind === 'restore') {
    try {
      const x = JSON.parse(d.restore || '');
      if (!x || !Array.isArray(x.students) || !Array.isArray(x.lessons) || !Array.isArray(x.payments)) throw 0;
      S = x; save(); render(); toast('Η επαναφορά ολοκληρώθηκε');
    } catch(err) { toast('Το κείμενο δεν είναι έγκυρο αντίγραφο. Επικόλλησέ το ολόκληρο.'); }
  }
});
render();
// Android back button (installed app): close the open screen first, then return to "Σήμερα"
window.__idiaBack = function(){
  if (UI.sheet) { closeSheet(); return true; }
  if (UI.tab !== 'today') { UI.tab = 'today'; render(); window.scrollTo(0,0); return true; }
  return false;
};
setInterval(() => { if (!UI.sheet && UI.tab === 'today' && !document.hidden) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !UI.sheet && UI.tab === 'today') render(); });
})();
</script>

<script>
/* Installed Android app: hardware back button */
(function(){
  function hook(){ var C = window.Capacitor, App = C && C.Plugins && C.Plugins.App; if (!App) return;
    App.addListener("backButton", function(){ if (!(window.__idiaBack && window.__idiaBack())) App.exitApp(); }); }
  if (document.readyState === "complete") hook(); else window.addEventListener("load", hook);
})();
</script>
