name: Build Android APK

on:
  push:
    branches: [idiaitera-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          echo "setup ok" > build.log
          bash scripts/build-apk.sh 2>&1 | tee -a build.log

      - name: Publish APK (GitHub Release)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: idiaitera-v${{ github.run_number }}
          name: Ιδιαίτερα v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Κατέβασε το **Idiaitera.apk** στο κινητό και άνοιξέ το για εγκατάσταση.
            Το Android θα ζητήσει να επιτρέψεις την εγκατάσταση από αυτή την πηγή (Chrome ή Αρχεία).
          files: Idiaitera.apk

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || echo "failed before the build step" > build.log
          tail -c 200000 build.log > build-tail.log
          gh release create "build-log-${{ github.run_number }}" build-tail.log --prerelease --target "${{ github.sha }}" --title "build log ${{ github.run_number }}" --notes "Αυτόματο log αποτυχημένου build"
        env:
          GH_TOKEN: ${{ github.token }}
