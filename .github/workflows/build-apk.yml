name: Build Android APK

on:
  push:
    branches: [idiaitera-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            res=android/app/src/main/res/mipmap-$d
            cp resources/icon-$d.png $res/ic_launcher.png
            cp resources/icon-$d.png $res/ic_launcher_round.png
            rm -f $res/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Idiaitera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Idiaitera-apk
          path: Idiaitera.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: idiaitera-v${{ github.run_number }}
          name: Ιδιαίτερα v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Κατέβασε το **Idiaitera.apk** στο κινητό και άνοιξέ το για εγκατάσταση.
            Το Android θα ζητήσει να επιτρέψεις την εγκατάσταση από αυτή την πηγή (Chrome ή Αρχεία).
          files: Idiaitera.apk
